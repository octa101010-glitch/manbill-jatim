<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APIK — Aplikasi Penilaian &amp; Insentif Kinerja Manbill</title>
  <meta name="description" content="APIK — Aplikasi Penilaian & Insentif Kinerja Manbill UP 3 Jawa Timur">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23003b5c'/%3E%3Cpath d='M36 6 L16 36 h12 l-4 22 L48 26 H35 l5-20z' fill='%23f5b301'/%3E%3C/svg%3E">
  <style>
    :root { --navy: #003b5c; --yellow: #f5b301; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--navy); overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #apikFrame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f1f5f9;
      opacity: 0; transition: opacity .3s ease; }
    #apikFrame.ready { opacity: 1; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff; text-align: center; gap: 10px; padding: 16px; }
    #loader .logo { font-size: 44px; font-weight: 800; letter-spacing: .12em; }
    #loader .logo span { color: var(--yellow); }
    #loader .sub { opacity: .8; font-size: 14px; }
    #loader .bar { width: 160px; height: 4px; background: rgba(255,255,255,.2); border-radius: 4px; overflow: hidden; margin-top: 6px; }
    #loader .bar i { display: block; width: 40%; height: 100%; background: var(--yellow); border-radius: 4px; animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    #fallback { display: none; font-size: 13px; opacity: .9; margin-top: 8px; }
    #fallback a { color: var(--yellow); }
  </style>
</head>
<body>
  <div id="loader">
    <div class="logo"><span>⚡</span>APIK</div>
    <div class="sub">Aplikasi Penilaian &amp; Insentif Kinerja Manbill</div>
    <div class="bar"><i></i></div>
    <div id="fallback">Aplikasi belum tampil? <a id="fallbackLink" href="#" target="_top">Buka langsung di sini</a> atau <a href="../" target="_top">kembali ke AREK Manbill</a>.</div>
  </div>

  <iframe id="apikFrame" title="APIK" allow="clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>

  <script src="../config.js"></script>
  <script>
    // URL diambil dari ../config.js (cukup diisi sekali di sana)
    const APIK_WEBAPP_URL = (window.PORTAL_CONFIG && window.PORTAL_CONFIG.apikUrl) || '';

    const frame = document.getElementById('apikFrame');
    const loader = document.getElementById('loader');
    document.getElementById('fallbackLink').href = APIK_WEBAPP_URL;

    frame.addEventListener('load', () => {
      frame.classList.add('ready');
      loader.style.display = 'none';
    });
    // Jika dalam 15 detik belum tampil, sediakan tautan langsung
    setTimeout(() => { document.getElementById('fallback').style.display = 'block'; }, 15000);

    frame.src = APIK_WEBAPP_URL;
  </script>
</body>
</html>
